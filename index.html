<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>photo.bored - Simple Photo Sharing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fafafa;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Masonry Gallery */
        #galleryContainer {
            max-width: 100%;
            margin-top: 40px;
        }

        #galleryContainer h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 300;
            color: #333;
        }

        .gallery {
            column-count: 4;
            column-gap: 16px;
        }

        @media (max-width: 1200px) {
            .gallery {
                column-count: 3;
            }
        }

        @media (max-width: 900px) {
            .gallery {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            .gallery {
                column-count: 1;
            }
        }

        .photo-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            break-inside: avoid;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            animation: cardAppear 0.6s ease-out backwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.15);
        }

        .photo-card-inner {
            position: relative;
            overflow: hidden;
        }

        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .photo-card:hover img {
            transform: scale(1.08);
        }

        .photo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 0%, transparent 50%, rgba(0,0,0,0.8) 100%);
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .photo-card:hover .photo-overlay {
            opacity: 1;
        }

        .photo-info {
            padding: 16px;
            background: white;
        }

        .photo-date {
            font-size: 0.95rem;
            color: #666;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .photo-location {
            font-size: 0.85rem;
            color: #999;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 60px 20px 20px;
            animation: fadeIn 0.3s;
            backdrop-filter: blur(10px);
        }

        .lightbox.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox-content {
            max-width: 95%;
            max-height: 95%;
            position: relative;
            animation: zoomIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .lightbox-close {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 28px;
            cursor: pointer;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .lightbox-info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 16px 32px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .lightbox-date {
            font-size: 1.1rem;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .lightbox-location {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* Stagger animation for cards */
        .photo-card:nth-child(1) { animation-delay: 0.05s; }
        .photo-card:nth-child(2) { animation-delay: 0.1s; }
        .photo-card:nth-child(3) { animation-delay: 0.15s; }
        .photo-card:nth-child(4) { animation-delay: 0.2s; }
        .photo-card:nth-child(5) { animation-delay: 0.25s; }
        .photo-card:nth-child(6) { animation-delay: 0.3s; }
        .photo-card:nth-child(7) { animation-delay: 0.35s; }
        .photo-card:nth-child(8) { animation-delay: 0.4s; }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 2rem;
            }

            .card {
                padding: 20px;
            }

            .lightbox-close {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>photo.bored</h1>
            <p class="subtitle">Simple, fast photo sharing</p>
        </header>

        <div class="card">
            <h2>Upload Photo</h2>
            <div id="uploadMessage" class="message"></div>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="listname">Album Name</label>
                    <input type="text" id="listname" name="listname" required>
                </div>
                <div class="form-group">
                    <label for="image">Choose Photo</label>
                    <input type="file" id="image" name="image" accept="image/*" required>
                </div>
                <button type="submit" id="uploadBtn">Upload Photo</button>
            </form>
        </div>

        <div class="card">
            <h2>View Album</h2>
            <div id="viewMessage" class="message"></div>
            <form id="viewForm">
                <div class="form-group">
                    <label for="viewUsername">Username</label>
                    <input type="text" id="viewUsername" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="viewListname">Album Name</label>
                    <input type="text" id="viewListname" name="listname" required>
                </div>
                <button type="submit">View Album</button>
            </form>
        </div>

        <div id="galleryContainer" class="hidden">
            <h2 id="galleryTitle">Photos</h2>
            <div id="gallery" class="gallery"></div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="Full size photo">
        </div>
        <div class="lightbox-info">
            <div class="lightbox-date" id="lightboxDate"></div>
            <div class="lightbox-location" id="lightboxLocation"></div>
        </div>
    </div>

    <script>
        let currentAlbum = { username: '', listname: '' };

        // Upload form handling
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('uploadBtn');
            const msg = document.getElementById('uploadMessage');
            btn.disabled = true;
            btn.textContent = 'Uploading...';

            const formData = new FormData(e.target);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(msg, 'success', 'Photo uploaded successfully!');
                    e.target.reset();

                    // Reload gallery if viewing the same album
                    const username = formData.get('username');
                    const listname = formData.get('listname');
                    if (currentAlbum.username === username && currentAlbum.listname === listname) {
                        loadGallery(username, listname);
                    }
                } else {
                    showMessage(msg, 'error', data.message || 'Upload failed');
                }
            } catch (error) {
                showMessage(msg, 'error', 'Network error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload Photo';
            }
        });

        // View form handling
        document.getElementById('viewForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('viewUsername').value;
            const listname = document.getElementById('viewListname').value;

            loadGallery(username, listname);
        });

        async function loadGallery(username, listname) {
            const msg = document.getElementById('viewMessage');
            const gallery = document.getElementById('gallery');
            const container = document.getElementById('galleryContainer');

            currentAlbum = { username, listname };

            gallery.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            container.classList.remove('hidden');

            try {
                const response = await fetch(`/api/view/${username}/${listname}`);

                if (!response.ok) {
                    throw new Error('Album not found');
                }

                const data = await response.json();
                displayPhotos(data.photos, username, listname);
                document.getElementById('galleryTitle').textContent = `${username}'s ${listname}`;

                // Scroll to gallery
                setTimeout(() => {
                    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            } catch (error) {
                gallery.innerHTML = '';
                showMessage(msg, 'error', 'Album not found or empty');
                container.classList.add('hidden');
            }
        }

        function displayPhotos(photos, username, listname) {
            const gallery = document.getElementById('gallery');

            if (!photos || photos.length === 0) {
                gallery.innerHTML = '<p class="loading">No photos in this album yet.</p>';
                return;
            }

            gallery.innerHTML = '';

            photos.forEach((photo, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card';

                const cardInner = document.createElement('div');
                cardInner.className = 'photo-card-inner';

                const img = document.createElement('img');
                const imageUrl = `/image/${username}/${listname}/${photo.filename}`;

                // Use medium for gallery display
                img.src = imageUrl + '?size=medium';
                img.loading = 'lazy';
                img.alt = 'Photo';

                const overlay = document.createElement('div');
                overlay.className = 'photo-overlay';

                cardInner.appendChild(img);
                cardInner.appendChild(overlay);

                const info = document.createElement('div');
                info.className = 'photo-info';

                const date = new Date(photo.date);
                const dateStr = date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                const dateDiv = document.createElement('div');
                dateDiv.className = 'photo-date';
                dateDiv.textContent = dateStr;

                info.appendChild(dateDiv);

                if (photo.location) {
                    const locationDiv = document.createElement('div');
                    locationDiv.className = 'photo-location';
                    locationDiv.innerHTML = `📍 ${photo.location}`;
                    info.appendChild(locationDiv);
                }

                card.appendChild(cardInner);
                card.appendChild(info);

                // Click to open lightbox
                card.onclick = () => openLightbox(imageUrl, dateStr, photo.location);

                gallery.appendChild(card);
            });
        }

        function openLightbox(imageUrl, date, location) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxDate = document.getElementById('lightboxDate');
            const lightboxLocation = document.getElementById('lightboxLocation');

            lightboxImage.src = imageUrl + '?size=large';
            lightboxDate.textContent = date;
            lightboxLocation.textContent = location ? `📍 ${location}` : '';
            lightboxLocation.style.display = location ? 'block' : 'none';

            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close lightbox on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        // Close lightbox on background click
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') {
                closeLightbox();
            }
        });

        function showMessage(element, type, text) {
            element.className = `message ${type}`;
            element.textContent = text;
            element.style.display = 'block';

            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        // Save username to localStorage
        const usernameInput = document.getElementById('username');
        const viewUsernameInput = document.getElementById('viewUsername');

        const savedUsername = localStorage.getItem('username');
        if (savedUsername) {
            usernameInput.value = savedUsername;
            viewUsernameInput.value = savedUsername;
        }

        usernameInput.addEventListener('change', (e) => {
            localStorage.setItem('username', e.target.value);
        });
    </script>
</body>
</html>
