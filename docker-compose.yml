version: '3.8'

services:
  photo-bored:
    build: .
    container_name: photo-bored
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/photos.db
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE=52428800  # 50MB
      - IMAGE_WORKERS=4
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - photo-network

networks:
  photo-network:
    driver: bridge
